<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIBA Guide Bot - Modern Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern-chat.css') }}">
</head>
<body class="bg-slate-900 text-gray-100">

    <!-- Header with Navigation -->
    <div class="fixed top-0 left-0 right-0 z-50 bg-slate-900/90 backdrop-blur-md border-b border-slate-800">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="/" class="flex items-center gap-3 hover:opacity-80 transition-opacity">
                    <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cdefs%3E%3ClinearGradient id='grad1' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%23001f6e;stop-opacity:1' /%3E%3Cstop offset='100%25' style='stop-color:%23003da5;stop-opacity:1' /%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='200' height='200' fill='url(%23grad1)' rx='20'/%3E%3Ctext x='100' y='120' font-size='80' font-weight='bold' fill='white' text-anchor='middle' font-family='Arial'%3EIBA%3C/text%3E%3C/svg%3E" alt="Sukkur IBA" class="w-10 h-10 rounded-lg" />
                    <span class="text-xl font-bold text-white hidden sm:inline">Guide Bot</span>
                </a>
            </div>
            <div class="flex items-center gap-4">
                <button id="soundToggleBtn" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 transition-colors" title="Toggle sound">
                    🔊
                </button>
                <button id="themeToggleBtn" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 transition-colors theme-toggle-btn" title="Toggle theme">
                    🌙
                </button>
            </div>
        </div>
    </div>

    <!-- Main Chat Container -->
    <div class="flex flex-col h-screen bg-slate-900 pt-20">

        <!-- Messages Area -->
        <div id="messagesArea" class="flex-1 overflow-y-auto scrollbar-hide px-4 sm:px-6 lg:px-8 py-6 max-w-5xl mx-auto w-full">
            <!-- Messages will be added here dynamically -->
        </div>

        <!-- Input Area -->
        <div class="bg-slate-900 border-t border-slate-800 px-4 sm:px-6 lg:px-8 py-6 max-w-5xl mx-auto w-full">
            <form id="messageForm" class="flex gap-3">
                <input
                    type="text"
                    id="messageInput"
                    placeholder="Ask me about admissions, fees, scholarships, or any university question..."
                    autocomplete="off"
                    class="flex-1 px-4 py-3 rounded-xl bg-slate-800 border border-slate-700 text-white placeholder-gray-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all"
                />
                <button
                    type="submit"
                    class="px-6 py-3 bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-700 hover:to-indigo-800 text-white rounded-xl font-semibold transition-all hover-lift"
                >
                    Send
                </button>
            </form>
            <p class="text-xs text-gray-500 mt-3 text-center">
                💡 Try asking: "What are scholarships?", "Tell me about admission", or "What are the fees?"
            </p>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script src="{{ url_for('static', filename='js/modern-chat.js') }}"></script>
</body>
</html>
